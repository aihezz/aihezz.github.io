# 站点基础信息
title: "aihezz 的博客"
author: "aihezz"
email: "ai_android_eh@163.com" # 你的联系邮箱，会显示在页脚
description: >- # 这段描述会出现在搜索引擎结果中
  Android 与 AI 相关的技术探索与深度思考

# 站点 URL 与基础路径
# 必须将 url 设置为你的站点地址
url: "https://aihezz.github.io"
# baseurl 保持为空，因为这是用户站点
baseurl: ""

# 主题与布局
theme: jekyll-theme-chirpy

# Jekyll 插件配置
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

# Chirpy 必需的配置
paginate: 10
timezone: Asia/Shanghai
lang: zh-CN

github:
  username: aihezz

img_cdn: ""

avatar: https://github.com/aihezz.png

social:
  name: aihezz
  email: ai_android_eh@163.com
  github: aihezz
  # twitter: username

# 排除文件
# Jekyll 在构建时会忽略这些文件/文件夹
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Markdown 渲染与代码高亮配置
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order
  categories:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: categories
    values:
      layout: category
      permalink: /categories/:title/
  - scope:
      path: "_tabs/android.md"
    values:
      layout: category
