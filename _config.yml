# 站点基础信息
title: "aihezz 的技术博客"
author: "aihezz"
email: "ai_android_eh@163.com" # 你的联系邮箱，会显示在页脚
description: >- # 这段描述会出现在搜索引擎结果中
  Android 与 AI 相关的技术探索与深度思考

# 站点 URL 与基础路径
# 必须将 url 设置为你的站点地址
url: "https://aihezz.github.io"
# baseurl 保持为空，因为这是用户站点
baseurl: ""

# 主题与布局
# 使用 Chirpy 主题 (remote_theme 方式)
remote_theme: cotes2020/jekyll-theme-chirpy

# Jekyll 插件配置
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

# Chirpy 必需的配置
paginate: 10
timezone: Asia/Shanghai
lang: zh-CN

github:
  username: aihezz

avatar: # 可选，侧边栏头像，可以填你的 github 头像链接或其他图床链接
  # url: "https://github.com/aihezz.png"

social:
  name: aihezz
  email: ai_android_eh@163.com
  github: aihezz
  # twitter: username

# 排除文件
# Jekyll 在构建时会忽略这些文件/文件夹
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
